services:
  - type: web
    name: telegram-file-messenger
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: file-messenger-db
          property: connectionString

      - key: PYTHON_VERSION
        value: 3.12

databases:
  - name: file-messenger-db
    plan: free