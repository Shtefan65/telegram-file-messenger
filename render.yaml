services:

  - type: pserv
    name: telegram-local-api
    runtime: image

    image:
      url: docker.io/aiogram/telegram-bot-api:latest

    envVars:
      - key: TELEGRAM_API_ID
        sync: false

      - key: TELEGRAM_API_HASH
        sync: false

    disk:
      name: telegram-api-data
      mountPath: /var/lib/telegram-bot-api
      sizeGB: 20


  - type: worker
    name: telegram-file-messenger

    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: python bot.py

    envVars:

      - key: BOT_TOKEN
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: file-messenger-db
          property: connectionString

      - key: BOT_API_BASE_URL
        value: http://telegram-local-api:8081


databases:

  - name: file-messenger-db

    databaseName: file_messenger

    user: file_messenger